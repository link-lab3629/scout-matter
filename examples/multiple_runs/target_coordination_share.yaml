# Added for scout-matter.
# Example configuration for the former multiple_runs.sh workflow.
# See UPSTREAM_CHANGES.md for the upstream baseline and change inventory.

batch_size: 20
runs: 50
system: Co-O

guidance:
  type: target_coordination_share
  parameters:
    Co-O: [5, 2.42]
  settings:
    forward_weight: 0.01
    backward_weight: 0.01
    normalize: true
    self_rec_steps: 3
    back_step: 2
    algorithm: 1

gpu: 0

base_dir: ./
log_file: log.txt
dry_run: false
