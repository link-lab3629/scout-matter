#
# Added for scout-matter.
# Verify that the documented Python 3.10 installation works in a clean environment.
# See UPSTREAM_CHANGES.md for the upstream baseline and change inventory.

name: Installation check

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install uv
        run: python -m pip install "uv==0.7.8"

      - name: Install scout-matter
        run: uv sync --locked --python 3.10

      - name: Check installed dependencies
        run: uv pip check

      - name: Smoke-test package and command line
        run: |
          uv run python -c "import mattergen, pandas, scipy, typing_extensions, yaml"
          uv run mattergen-generate --help

      # test_train_on_one_batch needs the Git LFS mp_20 cache. The two other upstream tests
      # use unseeded random structures and fail intermittently at float32 tolerance:
      # test_rdf (NumPy vs PyTorch distances) and test_translation_invariance[3.0-10]
      # (~10% of seeds, the same seeds on upstream MatterGen 842ffe7).
      - name: Run test suite
        run: >
          uv run pytest -q mattergen
          --deselect mattergen/tests/test_diffusion_instantiation.py::test_train_on_one_batch
          --deselect mattergen/common/tests/data_utils_test.py::test_rdf
          --deselect "mattergen/common/tests/data_utils_test.py::test_translation_invariance[3.0-10]"
